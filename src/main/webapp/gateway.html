<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure 256-Bit SSL Payment Gateway | GRAN & TECH</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="assets/css/grantech.css?v=2.2">
    <style>
        body {
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            color: #1e293b;
        }

        .gateway-card {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            animation: fadeInDown 0.3s ease;
        }

        /* Merchant Header */
        .gateway-header {
            background: var(--navy);
            color: #fff;
            padding: 35px 30px;
            text-align: center;
            position: relative;
        }
        .merchant-name {
            font-size: 13px;
            font-weight: 800;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .payment-amount {
            font-size: 46px;
            font-weight: 900;
            letter-spacing: -1.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        /* Form Body */
        .gateway-body {
            padding: 35px 30px;
        }
        .payment-methods-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }
        .method-tab {
            flex: 1;
            border: 2px solid var(--slate-200);
            border-radius: var(--radius-md);
            padding: 14px 0;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 700;
            font-size: 13px;
            color: var(--slate-600);
        }
        .method-tab.active {
            border-color: var(--navy);
            color: var(--navy);
            background: var(--slate-50);
        }
        .method-tab i {
            font-size: 20px;
            margin-bottom: 6px;
            display: block;
        }

        /* Card Input Wrapper */
        .card-input-wrapper {
            border: 1.5px solid #cbd5e1;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #fff;
            transition: var(--transition);
            margin-bottom: 24px;
        }
        .card-input-wrapper:focus-within {
            border-color: var(--navy);
            box-shadow: 0 0 0 3px rgba(10, 17, 40, 0.1);
        }
        .card-row {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--slate-200);
        }
        .card-row:last-child {
            border-bottom: none;
        }
        .card-row i {
            color: var(--slate-400);
            margin-right: 14px;
            font-size: 18px;
        }
        .card-input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 15px;
            color: var(--navy);
            font-weight: 600;
            background: transparent;
        }
        .split-row {
            display: flex;
            border-top: 1px solid var(--slate-200);
        }
        .split-col {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 16px;
        }
        .split-col:first-child {
            border-right: 1px solid var(--slate-200);
        }

        .save-card-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            font-size: 13px;
            color: var(--slate-600);
            font-weight: 600;
            cursor: pointer;
        }
        .save-card-row input {
            accent-color: var(--navy);
            width: 16px;
            height: 16px;
        }

        .btn-confirm-pay {
            width: 100%;
            padding: 20px;
            background: var(--navy);
            color: var(--white);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .btn-confirm-pay:hover {
            background: var(--accent);
            box-shadow: 0 10px 25px rgba(255, 62, 62, 0.35);
            transform: translateY(-2px);
        }

        .ssl-badge-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--slate-400);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="gateway-card">
    <div class="gateway-header">
        <div class="merchant-name">GRAN & TECH OFFICIAL RETAIL</div>
        <div class="payment-amount" id="gatewayAmountDisplay">$0.00</div>
        <div style="font-size: 12px; opacity: 0.7; margin-top: 4px;">Order Dispatch ID: Pending Authorization</div>
    </div>

    <div class="gateway-body">
        <div class="payment-methods-tabs">
            <div class="method-tab active" onclick="setMethodTab(this, 'CREDIT_CARD')">
                <i class="fal fa-credit-card"></i> Credit Card
            </div>
            <div class="method-tab" onclick="setMethodTab(this, 'APPLE_PAY')">
                <i class="fab fa-apple"></i> Apple Pay
            </div>
            <div class="method-tab" onclick="setMethodTab(this, 'PAYPAL')">
                <i class="fab fa-paypal"></i> PayPal
            </div>
        </div>

        <form id="gatewayPaymentForm" onsubmit="executeTransaction(event)">
            <div class="card-input-wrapper">
                <div class="card-row">
                    <i class="fal fa-credit-card-front" id="cardBrandIcon"></i>
                    <input type="text" id="ccNumber" class="card-input" placeholder="4532 &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; 8492" maxlength="19" required oninput="formatCardNumber(this)">
                </div>
                <div class="split-row">
                    <div class="split-col">
                        <input type="text" id="ccExpiry" class="card-input" placeholder="MM / YY" maxlength="5" required oninput="formatExpiry(this)">
                    </div>
                    <div class="split-col">
                        <input type="password" id="ccCvv" class="card-input" placeholder="CVC / CVV" maxlength="4" required>
                        <i class="fal fa-question-circle" style="margin: 0; font-size: 14px;" title="3-digit security code on back of card"></i>
                    </div>
                </div>
            </div>

            <label class="save-card-row">
                <input type="checkbox" checked>
                <span>Save credentials securely for 1-click Express Re-order</span>
            </label>

            <button type="submit" class="btn-confirm-pay" id="btnPaySubmit">
                <i class="fal fa-lock-alt"></i>
                <span id="btnPayText">Authorize & Pay</span>
            </button>

            <div class="ssl-badge-footer">
                <i class="fal fa-shield-check" style="color: #10b981; font-size: 14px;"></i>
                256-Bit Encrypted &bull; PCI DSS Compliant
            </div>
        </form>
    </div>
</div>

<script src="assets/js/grantech.js?v=2.2"></script>
<script>
    let draft = null;
    let selectedPaymentMethod = 'CREDIT_CARD';

    function initGateway() {
        const stored = sessionStorage.getItem('grantech_order_draft');
        if (stored) {
            try {
                draft = JSON.parse(stored);
            } catch (e) {}
        }

        if (!draft || !draft.amount) {
            // Fetch live from cart if sessionStorage was refreshed
            const cartUrl = window.GT && GT.apiUrl ? GT.apiUrl('/api/cart') : '/api/cart';
            fetch(cartUrl).then(r => r.json()).then(data => {
                const amt = data.subtotal || 1999.00;
                document.getElementById('gatewayAmountDisplay').textContent = `$${amt.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                document.getElementById('btnPayText').textContent = `Authorize & Pay $${amt.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            });
        } else {
            document.getElementById('gatewayAmountDisplay').textContent = `$${draft.amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            document.getElementById('btnPayText').textContent = `Authorize & Pay $${draft.amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }
    }

    function setMethodTab(el, method) {
        document.querySelectorAll('.method-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        selectedPaymentMethod = method;
    }

    function formatCardNumber(input) {
        let val = input.value.replace(/\D/g, '');
        let formatted = val.match(/.{1,4}/g)?.join(' ') || val;
        input.value = formatted;

        // Brand icon update
        const icon = document.getElementById('cardBrandIcon');
        if (val.startsWith('4')) {
            icon.className = 'fab fa-cc-visa';
            icon.style.color = '#1d4ed8';
        } else if (val.startsWith('5')) {
            icon.className = 'fab fa-cc-mastercard';
            icon.style.color = '#ea580c';
        } else {
            icon.className = 'fal fa-credit-card-front';
            icon.style.color = 'var(--slate-400)';
        }
    }

    function formatExpiry(input) {
        let val = input.value.replace(/\D/g, '');
        if (val.length >= 2) {
            input.value = val.substring(0, 2) + '/' + val.substring(2, 4);
        } else {
            input.value = val;
        }
    }

    async function executeTransaction(e) {
        e.preventDefault();

        const btn = document.getElementById('btnPaySubmit');
        const originalText = document.getElementById('btnPayText').textContent;
        btn.disabled = true;
        btn.innerHTML = `<i class="fal fa-spinner fa-spin"></i> Authorizing 256-Bit Transaction...`;

        const payload = {
            name: draft ? draft.name : 'Customer',
            email: draft ? draft.email : 'customer@grantech.com',
            address: draft ? draft.address : '12 Innovation Way, Colombo',
            city: draft ? draft.city : 'Colombo',
            postalCode: draft ? draft.postalCode : '00300',
            paymentMethod: selectedPaymentMethod
        };

        try {
            const checkoutUrl = window.GT && GT.apiUrl ? GT.apiUrl('/api/checkout') : '/api/checkout';
            const res = await fetch(checkoutUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (data.success && data.orderNo) {
                sessionStorage.removeItem('grantech_order_draft');
                setTimeout(() => {
                    window.location.href = `success.html?orderNo=${data.orderNo}`;
                }, 800);
            } else {
                alert('Payment Declined: ' + (data.message || 'Transaction could not be completed.'));
                btn.disabled = false;
                btn.innerHTML = `<i class="fal fa-lock-alt"></i> <span>${originalText}</span>`;
            }
        } catch (err) {
            alert('Payment Gateway Timeout. Please check your connectivity.');
            btn.disabled = false;
            btn.innerHTML = `<i class="fal fa-lock-alt"></i> <span>${originalText}</span>`;
        }
    }

    document.addEventListener('DOMContentLoaded', initGateway);
</script>
</body>
</html>
