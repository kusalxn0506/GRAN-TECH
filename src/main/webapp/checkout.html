<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | GRAN & TECH</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="assets/css/grantech.css?v=2.2">
    <style>
        body { background: #fdfdfd; }
        .checkout-layout {
            max-width: 1400px;
            margin: 0 auto;
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
        }

        /* Left Side: Forms */
        .form-side {
            padding: 60px 8% 80px 5%;
            border-right: 1px solid var(--slate-200);
        }
        .form-section-header {
            font-size: 18px;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-section-header a {
            font-size: 13px;
            color: var(--navy);
            text-decoration: underline;
        }

        .input-group-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .input-full {
            margin-bottom: 16px;
        }
        .checkout-input {
            width: 100%;
            padding: 16px 18px;
            border: 1.5px solid var(--slate-200);
            border-radius: var(--radius-sm);
            font-size: 14px;
            color: var(--navy);
            outline: none;
            transition: var(--transition);
            background: var(--white);
        }
        .checkout-input:focus {
            border-color: var(--navy);
            box-shadow: 0 0 0 3px rgba(10, 17, 40, 0.08);
        }

        .btn-pay-now {
            width: 100%;
            padding: 22px;
            background: var(--navy);
            color: var(--white);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 30px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-pay-now:hover {
            background: var(--accent);
            box-shadow: 0 10px 25px rgba(255, 62, 62, 0.3);
            transform: translateY(-2px);
        }

        /* Right Side: Order Summary */
        .summary-side {
            background: var(--slate-50);
            padding: 60px 5% 80px 8%;
        }
        .summary-item {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 20px;
        }
        .summary-item-img {
            width: 64px;
            height: 64px;
            background: var(--white);
            border: 1px solid var(--slate-200);
            border-radius: var(--radius-md);
            padding: 6px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .summary-item-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .summary-item-qty {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--navy);
            color: var(--white);
            font-size: 11px;
            font-weight: 800;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .summary-item-text {
            flex: 1;
        }
        .summary-item-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--navy);
        }
        .summary-item-variant {
            font-size: 12px;
            color: var(--slate-400);
            margin-top: 2px;
        }
        .summary-item-price {
            font-size: 15px;
            font-weight: 800;
            color: var(--navy);
        }

        .discount-row {
            display: flex;
            gap: 12px;
            margin: 30px 0;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--slate-200);
        }
        .discount-row input {
            flex: 1;
            padding: 14px 18px;
            border: 1.5px solid var(--slate-200);
            border-radius: var(--radius-sm);
            outline: none;
            font-size: 13px;
        }
        .discount-row button {
            padding: 14px 24px;
            background: var(--slate-200);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition);
        }
        .discount-row button:hover {
            background: var(--navy);
            color: var(--white);
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 14px;
            color: var(--slate-600);
        }
        .summary-total-line {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--slate-200);
        }
        .total-amount-val {
            font-size: 32px;
            font-weight: 900;
            color: var(--navy);
            letter-spacing: -1px;
        }

        @media (max-width: 992px) {
            .checkout-layout { grid-template-columns: 1fr; }
            .form-side { border-right: none; padding: 40px 5%; }
            .summary-side { padding: 40px 5%; }
        }
    </style>
</head>
<body>

<div class="checkout-layout">
    <!-- Left Column: Checkout Form -->
    <div class="form-side">
        <a href="index.html" class="gt-brand" style="margin-bottom: 40px; display: inline-block;">
            <span class="gt-logo">GRAN & TECH<span>.</span></span>
        </a>

        <div style="font-size: 12px; font-weight: 700; color: var(--slate-400); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 30px;">
            <a href="cart.html" style="color: var(--slate-400); text-decoration: none;">Cart</a> &nbsp;/&nbsp; 
            <span style="color: var(--navy);">Information & Payment</span>
        </div>

        <form id="checkoutForm" onsubmit="handleProceedToGateway(event)">
            <!-- 1. Customer Contact -->
            <div style="margin-bottom: 40px;">
                <div class="form-section-header">
                    <span>Contact Information</span>
                    <span id="authPromptLink"><a href="sign-in.html">Already have an account? Sign In</a></span>
                </div>
                <div class="input-full">
                    <input type="email" id="customerEmail" class="checkout-input" placeholder="Email address" required>
                </div>
                <div class="input-full">
                    <input type="text" id="customerPhone" class="checkout-input" placeholder="Phone number (e.g. +94 77 123 4567)" required>
                </div>
            </div>

            <!-- 2. Shipping Address -->
            <div style="margin-bottom: 40px;">
                <div class="form-section-header">
                    <span>Shipping Address</span>
                </div>
                <div class="input-group-grid">
                    <input type="text" id="firstName" class="checkout-input" placeholder="First name" required>
                    <input type="text" id="lastName" class="checkout-input" placeholder="Last name" required>
                </div>
                <div class="input-full">
                    <input type="text" id="shippingAddress" class="checkout-input" placeholder="Street address and suite / apt" required>
                </div>
                <div class="input-group-grid">
                    <input type="text" id="shippingCity" class="checkout-input" placeholder="City" value="Colombo" required>
                    <input type="text" id="shippingPostalCode" class="checkout-input" placeholder="Postal code" value="00300" required>
                </div>
            </div>

            <!-- 3. Proceed to Payment Gateway -->
            <button type="submit" class="btn-pay-now" id="btnSubmitCheckout">
                <i class="fal fa-lock-alt"></i>
                <span id="payBtnLabel">Proceed to Secure Payment Gateway</span>
            </button>
        </form>
    </div>

    <!-- Right Column: Order Summary -->
    <div class="summary-side">
        <h3 style="font-size: 20px; font-weight: 800; color: var(--navy); margin-bottom: 24px;">Order Summary</h3>
        <div id="checkoutItemsList">
            <div style="text-align: center; padding: 40px; color: var(--slate-400);">Loading bag items...</div>
        </div>

        <div class="discount-row">
            <input type="text" id="discountCodeInput" placeholder="Discount or promo code">
            <button type="button" onclick="applyPromo()">Apply</button>
        </div>

        <div class="summary-line">
            <span>Subtotal</span>
            <strong id="chkSubtotal">$0.00</strong>
        </div>
        <div class="summary-line">
            <span>Shipping</span>
            <span style="color: #10b981; font-weight: 700;">Free Courier Delivery</span>
        </div>
        <div class="summary-line">
            <span>Estimated Taxes</span>
            <span>$0.00 (Inclusive)</span>
        </div>

        <div class="summary-total-line">
            <div>
                <span style="font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--slate-400);">Total Due</span>
                <div style="font-size: 11px; color: var(--slate-400);">Including VAT & duty fees</div>
            </div>
            <div class="total-amount-val" id="chkTotal">$0.00</div>
        </div>
    </div>
</div>

<script src="assets/js/grantech.js?v=2.2"></script>
<script>
    let checkoutCart = [];
    let checkoutSubtotal = 0.0;

    async function initCheckout() {
        // Check session to autofill customer details
        try {
            const authUrl = window.GT && GT.apiUrl ? GT.apiUrl('/api/auth') : '/api/auth';
            const authRes = await fetch(authUrl);
            const authData = await authRes.json();
            if (authData.loggedIn && authData.user) {
                const u = authData.user;
                document.getElementById('customerEmail').value = u.email || '';
                document.getElementById('customerPhone').value = u.phone || '';
                const nameParts = (u.fullName || '').split(' ');
                document.getElementById('firstName').value = nameParts[0] || '';
                document.getElementById('lastName').value = nameParts.slice(1).join(' ') || '';
                document.getElementById('shippingAddress').value = u.address || '';
                document.getElementById('shippingCity').value = u.city || 'Colombo';
                document.getElementById('shippingPostalCode').value = u.postalCode || '00300';
                document.getElementById('authPromptLink').innerHTML = `<span style="color: #10b981; font-weight: 700;">Logged in as ${GT.escapeHtml(u.fullName)}</span>`;
            }
        } catch (e) {}

        // Fetch cart
        try {
            const cartUrl = window.GT && GT.apiUrl ? GT.apiUrl('/api/cart') : '/api/cart';
            const cartRes = await fetch(cartUrl);
            const cartData = await cartRes.json();
            checkoutCart = cartData.items || [];
            checkoutSubtotal = cartData.subtotal || 0.0;

            if (checkoutCart.length === 0) {
                alert('Your shopping bag is empty. Redirecting to storefront.');
                window.location.href = 'index.html';
                return;
            }

            renderCheckoutSummary();
        } catch (e) {
            console.error('Checkout init error:', e);
        }
    }

    function renderCheckoutSummary() {
        const list = document.getElementById('checkoutItemsList');
        const subtotalEl = document.getElementById('chkSubtotal');
        const totalEl = document.getElementById('chkTotal');
        const payBtn = document.getElementById('payBtnLabel');

        subtotalEl.textContent = `$${checkoutSubtotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        totalEl.textContent = `$${checkoutSubtotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        payBtn.textContent = `Pay $${checkoutSubtotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        list.innerHTML = checkoutCart.map(item => {
            const p = item.product || {};
            const unitPrice = item.unitPrice || p.price || 0;
            const itemSub = (typeof item.subtotal === 'number') ? item.subtotal : (unitPrice * item.quantity);

            return `
                <div class="summary-item">
                    <div class="summary-item-img">
                        <img src="${p.mainImage || 'assets/images/1.jpg'}" alt="${GT.escapeHtml(p.name)}">
                        <span class="summary-item-qty">${item.quantity}</span>
                    </div>
                    <div class="summary-item-text">
                        <div class="summary-item-title">${GT.escapeHtml(p.name)}</div>
                        <div class="summary-item-variant">${GT.escapeHtml(item.variantSummary || 'Standard Configuration')}</div>
                    </div>
                    <div class="summary-item-price">$${itemSub.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                </div>
            `;
        }).join('');
    }

    function applyPromo() {
        const code = document.getElementById('discountCodeInput').value.trim();
        if (code.toUpperCase() === 'GRAN10') {
            GT.showToast('10% VIP Discount Code applied!', 'success');
        } else {
            GT.showToast('Promo code invalid or expired', 'warning');
        }
    }

    function handleProceedToGateway(e) {
        e.preventDefault();

        // Save delivery details in sessionStorage for gateway.html
        const orderDraft = {
            email: document.getElementById('customerEmail').value.trim(),
            phone: document.getElementById('customerPhone').value.trim(),
            name: document.getElementById('firstName').value.trim() + ' ' + document.getElementById('lastName').value.trim(),
            address: document.getElementById('shippingAddress').value.trim(),
            city: document.getElementById('shippingCity').value.trim(),
            postalCode: document.getElementById('shippingPostalCode').value.trim(),
            amount: checkoutSubtotal
        };

        sessionStorage.setItem('grantech_order_draft', JSON.stringify(orderDraft));
        window.location.href = 'gateway.html';
    }

    document.addEventListener('DOMContentLoaded', initCheckout);
</script>
</body>
</html>
