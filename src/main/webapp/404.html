<!DOCTYPE html>
<html lang="en">
<head>
    <title>Page Not Found | GRAN & TECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background: #0a1128; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        header { padding: 30px 5%; display: flex; justify-content: space-between; position: absolute; width: 100%; z-index: 10; }
        .logo { font-size: 24px; font-weight: 900; letter-spacing: -1px; text-decoration: none; color: white; }

        .error-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; padding: 0 5%; }

        /* Massive typography effect */
        .glitch-text { font-size: 25vw; font-weight: 900; line-height: 0.8; letter-spacing: -10px; color: rgba(255,255,255,0.03); position: absolute; z-index: 1; user-select: none; pointer-events: none; }

        .content { position: relative; z-index: 2; }
        .content h1 { font-size: 48px; font-weight: 900; letter-spacing: -2px; margin-bottom: 20px; }
        .content p { font-size: 16px; opacity: 0.7; max-width: 400px; margin: 0 auto 40px; line-height: 1.6; }

        .btn-home { display: inline-block; background: white; color: #0a1128; padding: 20px 40px; font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; border-radius: 4px; transition: 0.3s; }
        .btn-home:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">GRAN & TECH</a>
</header>

<div class="error-container">
    <div class="glitch-text">404</div>
    <div class="content">
        <h1>Connection Lost.</h1>
        <p>The page you are looking for has been moved, deleted, or does not exist in our current architecture.</p>
        <a href="index.html" class="btn-home">Return to System</a>
    </div>
</div>

</body>
</html>
