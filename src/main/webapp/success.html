<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation | GRAN & TECH</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="assets/css/grantech.css">
    <style>
        body { background: #f8fafc; }
        .receipt-container {
            max-width: 800px;
            margin: 60px auto 120px;
            padding: 0 5%;
        }
        .receipt-card {
            background: #fff;
            border-radius: var(--radius-lg);
            border: 1px solid var(--slate-200);
            box-shadow: var(--shadow-xl);
            padding: 50px;
        }

        .success-banner {
            text-align: center;
            padding-bottom: 40px;
            border-bottom: 1px solid var(--slate-200);
            margin-bottom: 40px;
        }
        .success-icon-circle {
            width: 80px;
            height: 80px;
            background: #dcfce7;
            color: #166534;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 24px;
            animation: pulseSuccess 2s infinite;
        }
        .success-banner h1 {
            font-size: 36px;
            font-weight: 900;
            color: var(--navy);
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        .success-banner p {
            color: var(--slate-600);
            font-size: 15px;
        }
        .order-id-badge {
            display: inline-block;
            background: var(--slate-100);
            padding: 8px 18px;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 800;
            color: var(--navy);
            margin-top: 15px;
            letter-spacing: 0.5px;
        }

        /* Order Meta Grid */
        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 40px;
            padding: 24px;
            background: var(--slate-50);
            border-radius: var(--radius-md);
            font-size: 13px;
        }
        .meta-item strong {
            display: block;
            color: var(--slate-400);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .meta-item span {
            color: var(--navy);
            font-weight: 700;
        }

        /* Purchased Items Table */
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        .items-table th {
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--slate-400);
            padding-bottom: 14px;
            border-bottom: 1px solid var(--slate-200);
        }
        .items-table td {
            padding: 16px 0;
            border-bottom: 1px solid var(--slate-100);
            font-size: 14px;
        }
        .item-row-name {
            font-weight: 800;
            color: var(--navy);
        }
        .item-row-sub {
            font-size: 12px;
            color: var(--slate-400);
            margin-top: 2px;
        }

        /* Totals */
        .totals-block {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-bottom: 40px;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            width: 260px;
            font-size: 14px;
            color: var(--slate-600);
            margin-bottom: 8px;
        }
        .grand-total-row {
            display: flex;
            justify-content: space-between;
            width: 260px;
            font-size: 22px;
            font-weight: 900;
            color: var(--navy);
            padding-top: 15px;
            border-top: 2px solid var(--slate-200);
        }

        /* Actions */
        .receipt-actions {
            display: flex;
            gap: 16px;
        }
        .btn-print {
            flex: 1;
            padding: 16px;
            background: var(--white);
            color: var(--navy);
            border: 1.5px solid var(--slate-300);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: var(--transition);
        }
        .btn-print:hover {
            background: var(--slate-100);
        }
        .btn-continue {
            flex: 1;
            padding: 16px;
            background: var(--navy);
            color: var(--white);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: var(--transition);
        }
        .btn-continue:hover {
            background: var(--accent);
        }

        @keyframes pulseSuccess {
            0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 16px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @media print {
            header, footer, .receipt-actions { display: none !important; }
            .receipt-container { margin: 0; padding: 0; max-width: 100%; }
            .receipt-card { box-shadow: none; border: none; padding: 0; }
        }
    </style>
</head>
<body>

<!-- Header -->
<header class="gt-header">
    <a href="index.html" class="gt-brand">
        <span class="gt-logo">GRAN & TECH<span>.</span></span>
    </a>
    <div class="gt-nav-right">
        <a href="index.html" class="nav-link-standard">Storefront</a>
        <a href="search.html" class="nav-link-standard">Archive</a>
        <a href="support.html" class="nav-link-standard">Support</a>
    </div>
</header>

<div class="receipt-container">
    <div class="receipt-card" id="receiptCardContent">
        <div style="text-align: center; padding: 60px; color: var(--slate-400);">
            <i class="fal fa-spinner fa-spin" style="font-size: 32px; margin-bottom: 12px;"></i>
            <p>Retrieving transaction receipt...</p>
        </div>
    </div>
</div>

<script src="assets/js/grantech.js"></script>
<script>
    async function loadReceipt() {
        const urlParams = new URLSearchParams(window.location.search);
        const orderNo = urlParams.get('orderNo') || 'GT-8492';
        const card = document.getElementById('receiptCardContent');

        try {
            const res = await fetch(`/api/checkout?orderNo=${encodeURIComponent(orderNo)}`);
            const data = await res.json();

            if (data.success && data.order) {
                const o = data.order;
                const dateStr = new Date(o.createdAt || Date.now()).toLocaleDateString('en-US', {
                    year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                card.innerHTML = `
                    <div class="success-banner">
                        <div class="success-icon-circle">
                            <i class="fal fa-check"></i>
                        </div>
                        <h1>Order Confirmed!</h1>
                        <p>Thank you for your purchase. We have received your payment and dispatched your order for hardware fulfillment.</p>
                        <div class="order-id-badge">Order ID: #${GT.escapeHtml(o.orderNo)}</div>
                    </div>

                    <div class="meta-grid">
                        <div class="meta-item">
                            <strong>Customer Name</strong>
                            <span>${GT.escapeHtml(o.customerName)}</span>
                        </div>
                        <div class="meta-item">
                            <strong>Email Address</strong>
                            <span>${GT.escapeHtml(o.customerEmail)}</span>
                        </div>
                        <div class="meta-item">
                            <strong>Date of Order</strong>
                            <span>${dateStr}</span>
                        </div>
                        <div class="meta-item">
                            <strong>Payment Method</strong>
                            <span>${GT.escapeHtml(o.paymentMethod || 'Credit Card')} &bull; Status: <span style="color: #166534;">PAID</span></span>
                        </div>
                        <div class="meta-item" style="grid-column: 1/-1;">
                            <strong>Delivery Destination</strong>
                            <span>${GT.escapeHtml(o.shippingAddress)}, ${GT.escapeHtml(o.shippingCity)} ${GT.escapeHtml(o.shippingPostalCode || '')}</span>
                        </div>
                    </div>

                    <table class="items-table">
                        <thead>
                            <tr>
                                <th>Hardware Item</th>
                                <th style="text-align: center;">Qty</th>
                                <th style="text-align: right;">Price</th>
                                <th style="text-align: right;">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(o.items || []).map(item => `
                                <tr>
                                    <td>
                                        <div class="item-row-name">${GT.escapeHtml(item.productName)}</div>
                                        ${item.variantSummary ? `<div class="item-row-sub">${GT.escapeHtml(item.variantSummary)}</div>` : ''}
                                    </td>
                                    <td style="text-align: center; font-weight: 700;">${item.quantity}</td>
                                    <td style="text-align: right;">$${item.unitPrice.toFixed(2)}</td>
                                    <td style="text-align: right; font-weight: 800;">$${item.subtotal.toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <div class="totals-block">
                        <div class="total-row">
                            <span>Subtotal:</span>
                            <strong>$${o.subtotal.toFixed(2)}</strong>
                        </div>
                        <div class="total-row">
                            <span>Courier Shipping:</span>
                            <span style="color: #166534; font-weight: 700;">Free</span>
                        </div>
                        <div class="total-row">
                            <span>Taxes:</span>
                            <span>$0.00</span>
                        </div>
                        <div class="grand-total-row">
                            <span>Total Paid:</span>
                            <span>$${o.totalAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                        </div>
                    </div>

                    <div class="receipt-actions">
                        <button class="btn-print" onclick="window.print()">
                            <i class="fal fa-print" style="margin-right: 6px;"></i> Print Invoice
                        </button>
                        <a href="index.html" class="btn-continue">
                            Continue Shopping &rarr;
                        </a>
                    </div>
                `;
            } else {
                card.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <h2>Order Not Found</h2>
                        <p style="color: #666; margin: 15px 0 25px;">We could not locate order #${GT.escapeHtml(orderNo)}.</p>
                        <a href="index.html" class="btn-continue" style="display: inline-block; padding: 12px 30px;">Return Home</a>
                    </div>
                `;
            }
        } catch (e) {
            card.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--accent);">Failed to load order receipt.</div>`;
        }
    }

    document.addEventListener('DOMContentLoaded', loadReceipt);
</script>
</body>
</html>
